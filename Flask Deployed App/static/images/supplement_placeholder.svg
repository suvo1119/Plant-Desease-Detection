<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122c1f" />
      <stop offset="100%" stop-color="#0a1a12" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Ambient Circle Glow -->
  <circle cx="150" cy="150" r="80" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  
  <!-- Supplement Bottle SVG Graphic -->
  <g transform="translate(75, 45)">
    <!-- Bottle Cap -->
    <rect x="40" y="10" width="70" height="24" rx="6" fill="url(#capGrad)" />
    <rect x="45" y="34" width="60" height="12" fill="#047857" />
    
    <!-- Bottle Body -->
    <rect x="20" y="46" width="110" height="150" rx="20" fill="url(#bottleGrad)" filter="url(#glow)" />
    
    <!-- Label -->
    <rect x="30" y="70" width="90" height="100" rx="8" fill="#ffffff" opacity="0.95" />
    
    <!-- Leaf Icon on Label -->
    <path d="M75 90 C 55 110, 55 140, 75 150 C 95 140, 95 110, 75 90 Z" fill="#059669" />
    <path d="M75 90 L 75 150" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    
    <!-- Cross Badge -->
    <circle cx="75" cy="138" r="10" fill="#10b981" />
    <path d="M70 138 L80 138 M75 133 L75 143" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
  
  <text x="150" y="245" font-family="sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">PLANT CARE FORMULA</text>
  <text x="150" y="265" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle" opacity="0.8">Organic Supplement</text>
</svg>
